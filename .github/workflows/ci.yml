name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Switch to `npm ci` once package-lock.json is committed.
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
